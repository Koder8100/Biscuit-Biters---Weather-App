<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
   * {   
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Weather-themed gradient: Soft Sky Blue to Deep Ocean Blue */
    background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
    overflow: hidden;
}

.weather-background {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?auto=format&fit=crop&w=1920&q=80'); /* Optional weather-related background image */
    background-size: cover;
    background-position: center;
}

.signup-container {
    background: rgba(255, 255, 255, 0.2); /* Semi-transparent */
    backdrop-filter: blur(15px); /* Frosted glass effect */
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 40px;
    border-radius: 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    text-align: center;
    color: #fff;
}

.signup-header h1 {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 5px;
}

.signup-header p {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-bottom: 30px;
}

.input-group {
    text-align: left;
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 8px;
    font-weight: 400;
}

.input-group input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.3);
    color: #fff;
    outline: none;
    transition: 0.3s ease;
}

.input-group input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

.input-group input:focus {
    background: rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}

.signup-btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #5c7cfa;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
}

.signup-btn:hover {
    background: #f0f0f0;
    transform: translateY(-2px);
}

.signup-btn:active {
    transform: translateY(0);
}

.signup-footer {
    margin-top: 25px;
    font-size: 0.85rem;
}

.signup-footer a {
    color: #fff;
    text-decoration: underline;
    font-weight: 600;
}

</style>
<body>

    <div class="weather-background">
        <div class="signup-container">
            <div class="signup-header">
                <h1>Biscuit Biters</h1>
                <p>Personalize your weather experience</p>
            </div>
            
            <form action="#" class="signup-form">
                <div class="input-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@weather.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min. 8 characters" required>
                </div>

                <button type="submit" class="signup-btn">Get Started</button>
            </form>

            <div class="signup-footer">
                <p>Already have an account? <a href="#">Login</a></p>
            </div>
        </div>
    </div>
    
</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    const signupForm = document.querySelector('.signup-form');
    const signupBtn = document.querySelector('.signup-btn');

    // 1. Smooth Button Interaction
    signupBtn.addEventListener('mousedown', () => {
        signupBtn.style.transform = 'scale(0.98)';
    });

    signupBtn.addEventListener('mouseup', () => {
        signupBtn.style.transform = 'translateY(-2px)';
    });

    // 2. Form Submission & Validation
    signupForm.addEventListener('submit', (e) => {
        e.preventDefault();

        // Get values from inputs
        const name = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Basic Validation Logic
        if (password.length < 8) {
            alert("For your security, please use at least 8 characters.");
            return;
        }

        // 3. Simulating a "Weather App" Loading State
        signupBtn.disabled = true;
        signupBtn.innerText = "Connecting to Satellite...";
        signupBtn.style.opacity = "0.7";

        // Mimic an API call delay
        setTimeout(() => {
            console.log("User Registered:", { name, email });
            alert(`Welcome to Biscuit Biters, ${name}! Redirecting to your local forecast...`);
            
            // Here you would redirect to your main weather dashboard
            // window.location.href = 'dashboard.html';
            
            signupBtn.disabled = false;
            signupBtn.innerText = "Get Started";
            signupBtn.style.opacity = "1";
        }, 2000);
    });

    // 4. Input Focus Effects (Dynamic Glow)
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.style.transition = '0.3s';
            input.style.borderBottom = '2px solid #fff';
        });
        
        input.addEventListener('blur', () => {
            input.style.borderBottom = 'none';
        });
    });
});
</script>
</html>
