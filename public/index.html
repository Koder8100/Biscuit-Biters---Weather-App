<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <title>Weather App</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            background: darkgray url('https://4kwallpapers.com/images/wallpapers/milky-way-starry-sky-night-mountains-lake-reflection-cold-5k-5760x3840-287.jpg');
            background-position: center;
            background-attachment: fixed; 
            background-repeat: no-repeat;
            background-size: cover;
        }
        
        footer {
            height: 5vh;
            width: 100%;
            background-color: #1E2A56;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        main {
            height: 85vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            overflow: hidden;
        }
        #initial-search {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #initial-search p {
            font-size: 24px;
        }
        #search {
            width: 80%;
            padding: 10px;
            border: none;
            background-color: blanchedalmond;
            border-radius: 10px;
            font-weight: 600;
            margin-right: 30px;
        }
        #search:hover, #search:focus {
            transform: scale(1.05);
            transition: 0.5s;
        }

        /* style for when user searches for initially */

        .left-panel {
            width: 30%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .right-panel {
            width: 70%;
            display: flex;
            flex-direction: column;
            margin-right: 20px;
            padding: 15px;
            height: 100%;
            
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }
        .forcast-map {
            display: flex;
            gap: 15px;
            align-items: stretch;
            height: 100%;
        }

        .map {
            background: lightgray;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 300px;
            border-radius: 10px;
            margin-top: 10px;
            height: 95%;
            z-index: 0;
        }
        .forecast-container {
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 10px;
            flex: 1;
            max-width: 450px;

        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        .forecast-day {
            background-color: #6A89A7;
            padding: 6px;
            font-size: 13px;
            border-radius: 12px;
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .forecast-day:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .forecast-day:nth-child(4),
        .forecast-day:nth-child(5) {
            grid-column: span 1;
        }
        .forecast-day:first-child {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-weight: bold;
        }
        
        .weather-main {
            width: 100%; 
            max-width: 400px; 
            height: 100%;
            max-height: 100%; 
            
            background: #6A89A7;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);

            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;

            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .weather-main img {
            width: 100px;
        }
        .weather-main h1 {
            font-size: 2rem;
            margin: 5px 0;
            color: #fff;
        }
        .weather-main h2 {
            font-size: 1.1rem;
            color: #fff;
        }

        .weather-main p {
            font-size: 0.9rem;
            text-align: center;
            color: #fff;
        }
        .top-section {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        #save-btn {
            width: auto;
            padding: 5px 10px;
            margin-right: 20px;
        }

        .weather-details {
            width: 100%;
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .weather-details div {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .weather-details img {
            width: 60px;
            height: auto;
        }
        .main-weather {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>WeatherSmart</h1>
        <div class="login-and-signup">
            <button onclick="window.location.replace('login.html');">Login</button>
            <button onclick="window.location.replace('signup.html');">Sign Up</button>
        </div>

        <div class="right-section">
            <div class="menu-icon" onclick="openMenu()">☰</div>
            <!-- <div class="profile-pic" onclick="openMenu()"></div> -->
        </div>
    </nav>
    <!-- Sidebar Menu -->
    <div id="sidebar" class="sidebar">
        <a class="close" href="#" onclick="closeMenu()">✖ Close</a>
        <a href="index.html">Home</a>
        <a href="saved.html">Saved Locations</a>
        <a href="#">Settings</a>
        <!-- <a href="#" onclick="logout()">Logout</a> -->
    </div>
    <main>
        <div id="initial-search">
            <h1 style="color: #fff;">Stay Ahead of the Weather</h1>
            <p style="color: #fff;">Enter a city to see current conditions and upcoming forecasts instantly.</p>
            <div>
                <input type="search" id="search" placeholder="Enter city...">
                <button id="search-btn" onclick="getcurrentWeather()">search</button>
            </div>
        </div>
    </main>
    <footer>© 2026 WeatherSmart App</footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        function openMenu() {
            document.getElementById("sidebar").classList.add("active");
        }

        function closeMenu() {
            document.getElementById("sidebar").classList.remove("active");
        }

        function updateCurrentWeather(data) {
            const main = document.querySelector("main");
            const date = data.dt * 1000;
            const dateString = new Date(date).toLocaleDateString("en-US", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });
            main.innerHTML = `
                <div class="left-panel">
                    <div id="weatherMain" class="weather-main">

                    <div class="top-section">
                        <h2 id="city-name">${data.name}</h2>
                        <button id="save-btn">🔖Save</button>
                    </div>

                    <div class="main-weather">
                        <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}.png" alt="Weather Icon">
                        <h1 id="temperature">${data.main.temp}°C</h1>
                        <h2>Feels like: ${data.main.feels_like}°C</h2>
                        <p id="description">${data.weather[0].description}</p>
                        <p id="date">${dateString}</p>
                    </div>

                    <div class="weather-details">
                        <img src="images/humidity.png" alt="Humidity Icon">
                        <div>
                            <p id="humidity">${data.main.humidity}%</p>
                            <span style="color: #fff;">Humidity</span>
                        </div>
                        <img src="images/wind.png" alt="Wind Icon">
                        <div>
                            <p id="wind-speed">${data.wind.speed} km/h</p>
                            <span style="color: #fff;">Wind</span>
                        </div>
                    </div>

                </div>

            </div>
                </div>
                <div class="right-panel">

                    <div class="search-bar">
                        <input id="search" type="text" placeholder="Enter city...">
                        <button id="search-btn" onclick="getcurrentWeather()">Search</button>
                    </div>

                    <div class="forcast-map">
                                <div class="forecast-container">
                                <h3 style="color: #fff;">5-Day Forecast</h3>
                                <div class="forecast">

                                </div>
                            </div>

                            <div id="map" class="map"></div>
                    </div>

                </div>
            `;
        }

        function updateForecast(data) {
            const forecastContainer = document.querySelector(".forecast");
            forecastContainer.innerHTML = "";

            // Get one forecast per day (12:00 PM)
            const dailyData = data.list.filter(item =>
                item.dt_txt.includes("12:00:00")
            );

            dailyData.slice(0, 5).forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString("en-US", { weekday: "short" });

                const temp = Math.round(item.main.temp);
                const icon = item.weather[0].icon;

                forecastContainer.innerHTML += `
                    <div class="forecast-day">
                        <h4>${day}</h4>
                        <img src="https://openweathermap.org/img/wn/${icon}.png" alt="Weather Icon">
                        <p>${temp}°C</p>
                    </div>
                `;
            });
        }

        function generateMap(lat, lon) {
            const map = L.map('map').setView([lat, lon], 10);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.marker([lat, lon]).addTo(map)
                .bindPopup('City Location')
                .openPopup();
        }

        async function getcurrentWeather() {
            const apiKey = "c10ab06a2b72a75405b530878b269f14";
            const city = document.getElementById("search").value;

            try {
                // Fetch current weather
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
                if (!response.ok) throw new Error("City not found");
                const weatherData = await response.json();

                // Fetch forecast
                const response2 = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`);
                if (!response2.ok) throw new Error("City not found");
                const forecastData = await response2.json();

                // Update UI
                updateCurrentWeather(weatherData);
                updateForecast(forecastData);
                generateMap(weatherData.coord.lat, weatherData.coord.lon);

            } catch (error) {
                alert("City not found! Please check the spelling or try a different city.");
            }
        }
    </script>
</body>
</html>
