<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whatever Name</title>
 

 <style>






*{
margin:0;
padding:0;
box-sizing:border-box;

}



body {
display:flex;
align-items: center;
justify-content:center;
min-height:100vh;
width:100%;
padding: 0 10px;
}



body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background: url("weather-background-2z225cj77b62y4c9 (1).jpg"), #000;
background-position:center;
background-size: cover;
}


.wrapper {
width:400px;
border-radius:8px;
padding:30px;
-webkit-backdrop-filter:blur(17px);
text-align:center;
border:1px solid rgba(255, 255, 255, 0.5);
backdrop-filter:blur(8px);
}



form{
display:flex;
flex-direction:column;
}



h2{
font-size:2rem;
margin-bottom:20px;
color:rgb(255, 255, 255)
}


.input-field {
position:relative;
border-bottom:2px solid rgb(208, 185, 185);
margin:15px 0;
}





.input-field label {
top:50%;
position: absolute;
left:0;
transform:translateY(-50%);
color:rgb(255, 255, 255);
font-size: 16px;
pointer-events:none;
transition: 0.15s ease;
}


.input-field input{
width: 100%;
height: 40px;
background: transparent;
border: none;
outline: none;
font-size: 16px;
color: rgb(255, 255, 255);
}


.input-field input:focus~label,
.input-field input:valid~label {
font-size: 0.8rem;
top:12px;
transform:translateY(-55%);
}







.forget{
display:flex;
align-items: center;
justify-content:space-between;
margin: 50px 0 35px 0;
color:rgb(255, 255, 255);
}





#remember{
accent-color:rgb(255, 255, 255);
}
.forget label {
display: flex;
align-items: center;
}
.forget label p {
margin-left: 8px;
}
.wrapper a {
color: rgb(255, 255, 255);
text-decoration: none;
}

.wrapper a:hover {
text-decoration: underline;
}


button {
background:rgb(239, 230, 230);
color:rgb(0, 0, 0);
font-weight:600;
border:none;
padding:12px 20px;
cursor:pointer;
border-radius: 36px;
font-size:16px;
border: 2px solid transparent;
transition:0.3s ease;
}


button:hover {
  color: rgb(255, 255, 255);
  border-color: rgb(255, 255, 255);
  background: rgba(255, 255, 255, 0.15);


}



.register {
text-align:center;
margin-top: 30px;
color:rgb(255, 255, 255);
}

</style>

</head>
<body>
<div class="wrapper">
<form action="#">
      <h2>Login</h2>
     <div class="input-field">
     <input type="text" required>
    <label>Enter your email</label>
    </div>
    <div class="input-field">
    <input type="password" required>
        <label>Enter your password</label>
    </div>
    <div class="forget">
  <label for="remember">
         <input type="checkbox" id="remember">
            <p>Remember me</p>
        </label>
        <a href="#">Forgot password?</a>
    </div>
    <button type="submit">Log In</button>
    <div class="register">
    <p>Don't have an account? <a href="#">Sign Up Now!</a></p>
    </div>
    </form>
    </div>
    </body>
    
    </html>
