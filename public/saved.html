<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Locations</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
        body, html {
        height: 100%;
        margin: 0;
        padding: 0;
        }
        body {
            background-color: aliceblue;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-container {
            display: flex;
            flex: 1;
        }
        .locations-list {
            background-color: #6A89A7;
            color: white;
            padding: 20px;
            max-width: 400px;
            width: 400px;
        }
        .location-container {
            margin-top: 20px;
            overflow-y: auto;
            width: 90%;
            height: 70vh;
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
        }
        .location-item {
            padding: 15px;
            margin-bottom: 10px;
            background-color: #2d3a70;
            border-radius: 10px;
            cursor: pointer;
        }
        .location-item:hover {
            background-color: lightblue;
            color: black;
        }
        .details-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .weather-card {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: black;
        }
        .extra {
            margin-top: 5px;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .top {
            align-self: flex-end;
        }
        .weather-card img {
            width: 100px;
            height: auto;
        }
        .map {
            background-color: #dfe6e9;
            border-radius: 15px;
            flex: 2;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #636e72;
            z-index: 0;
        }
        footer {
            height: 5vh;
            background-color: #1E2A56;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav>
        <h1>WeatherSmart</h1>

        <div class="right-section">
            <div class="menu-icon" onclick="openMenu()">☰</div>
            <!-- <div class="profile-pic" onclick="openMenu()"></div> -->
        </div>
    </nav>
    <div id="sidebar" class="sidebar">
        <a class="close" href="#" onclick="closeMenu()">✖ Close</a>
        <a href="index.html">Home</a>
        <a href="saved.html">Saved Locations</a>
        <a href="#">Settings</a>
        <!-- <a href="#" onclick="logout()">Logout</a> -->
    </div>

    <div class="main-container">
        <div class="locations-list" id="locationsList">
            <h2>Saved Locations</h2>
            <div class="location-item" onclick="getcurrentWeather('Port of Spain')">Port of Spain</div>
        </div>
        <div class="details-panel">
           <p style="color: #636e72; font-size: 18px;">Select a saved location to view its weather details.</p>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script>
        function openMenu() {
            document.getElementById("sidebar").classList.add("active");
        }

        function closeMenu() {
            document.getElementById("sidebar").classList.remove("active");
        }
        function updateCurrentWeather(data) {
            const weatherDetails = document.querySelector('.details-panel');
            const date = data.dt * 1000;
            const dateString = new Date(date).toLocaleDateString("en-US", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });
            weatherDetails.innerHTML = `
                <div class="weather-card">
                    <div class="top">
                        <button id="save-btn" style="background-color: red;">🔖Unsave</button>
                    </div>
                    <h2 id="city-name">${data.name}</h2>
                    <img id="weather-icon" src="https://openweathermap.org/img/wn/${data.weather[0].icon}.png">
                    <h1 id="temperature">${Math.round(data.main.temp)}°C</h1>
                    <h2>Feels like: ${Math.round(data.main.feels_like)}°C</h2>
                    <p id="condition">${data.weather[0].description}</p>
                    <p id="date">${dateString}</p>

                    <div class="extra">
                        <p id="humidity">Humidity: ${data.main.humidity}%</p>
                        <p id="wind">Wind: ${data.wind.speed} km/h</p>
                    </div>
                </div>
                <div id="map" class="map">Map here</div>
            `;
        }

        function generateMap(lat, lon) {
            const map = L.map('map').setView([lat, lon], 10);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.marker([lat, lon]).addTo(map)
                .bindPopup('City Location')
                .openPopup();
        }

        async function getcurrentWeather(city_name) {
            const apiKey = "c10ab06a2b72a75405b530878b269f14";
            let city = String(city_name);
            try {
              
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
                const weatherData = await response.json();
            
                console.log(weatherData);
                updateCurrentWeather(weatherData);
                generateMap(weatherData.coord.lat, weatherData.coord.lon);

            } catch (error) {
                alert("City not found! Please check the spelling or try a different city.");
            }
        }
</script>
</body>
</html>
