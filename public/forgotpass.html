<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSmart - Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ccc; border-radius: 8px; }
        .reset-btn { width: 100%; background: #1E2A56; color: white; border: none; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .back-link { display: block; margin-top: 20px; text-decoration: none; color: #1E2A56; font-size: 14px; }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a link to reset your password.</p>
        
        <input type="email" id="email" placeholder="Enter your registered email" required>
        
        <button class="reset-btn" id="send-reset-btn">Send Reset Link</button>
        
        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <script type="module" src="auth.js"></script>

    <script type="module">
        import { sendPasswordReset, auth } from "./auth.js";

        document.getElementById("send-reset-btn").addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            if (!email) {
                alert("Please enter your email address.");
                return;
            }

            try {
                await sendPasswordReset(auth, email);
                alert("Password reset email sent! Please check your inbox. If you don't see it, check your spam folder.");
                window.location.href = "login.html";
            } catch (error) {
                alert("Error sending reset email. Please check the email address and try again.");
            }
        })
    </script>
</body>
</html>
