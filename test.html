<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">WeatherSmart</h1>
    <div>
      <button class="mr-4">Login</button>
      <button class="bg-white text-blue-600 px-3 py-1 rounded">Sign Up</button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="flex flex-col items-center justify-center text-center flex-grow px-4">
    <h2 class="text-4xl font-bold mb-4">Check Your Weather Instantly</h2>
    <p class="text-gray-600 mb-6">Get real-time weather updates and plan your day smarter.</p>

    <div class="flex gap-2 w-full max-w-md">
      <input id="cityInput" type="text" placeholder="Enter city..." class="flex-grow p-2 border rounded" />
      <button onclick="getWeather()" class="bg-blue-600 text-white px-4 py-2 rounded">Search</button>
    </div>

    <div id="weatherResult" class="mt-8"></div>
  </section>

  <!-- Footer -->
  <footer class="bg-blue-600 text-white text-center p-3">
    <p>© 2026 WeatherSmart App</p>
  </footer>

  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value;
      const apiKey = "YOUR_API_KEY_HERE";

      if (!city) {
        alert("Please enter a city name");
        return;
      }

      try {
        const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`);
        const data = await res.json();

        if (data.cod !== 200) {
          document.getElementById("weatherResult").innerHTML = `<p class='text-red-500'>City not found</p>`;
          return;
        }

        document.getElementById("weatherResult").innerHTML = `
          <div class="bg-white p-6 rounded shadow">
            <h3 class="text-2xl font-bold">${data.name}</h3>
            <p class="text-gray-600">${data.weather[0].description}</p>
            <p class="text-4xl font-bold mt-2">${data.main.temp}°C</p>
          </div>
        `;

      } catch (error) {
        console.error(error);
        document.getElementById("weatherResult").innerHTML = `<p class="text-red-500">Unable to fetch weather data.</p>`;
      }
    }
  </script>
</body>
</html>
